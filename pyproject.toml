[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsr-evalkit"
version = "0.1.0"
description = "Offline, protocol-explicit evaluation of pre-generated video super-resolution results"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.24,<2", "scipy>=1.10,<1.15", "Pillow>=10,<12", "PyYAML>=6,<7", "av==14.2.0"]

[project.optional-dependencies]
deep = ["torch>=2.2,<2.6", "torchvision>=0.17,<0.21", "pyiqa==0.1.15.post2"]
test = ["pytest>=8,<9", "opencv-python-headless>=4.8,<4.12"]

[project.scripts]
vsr-eval = "vsr_evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vsr_evalkit = ["resources/*.json", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
